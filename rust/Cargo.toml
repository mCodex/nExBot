[workspace]
members = ["apps/nexbot-engine", "crates/nexbot-updater"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.balanced]
inherits = "release"
opt-level = 3
lto = "thin"
