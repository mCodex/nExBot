name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
      - if: runner.os == 'macOS'
        run: brew install python-tk@3.12
      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/nexbot-python"
          "$RUNNER_TEMP/nexbot-python/bin/python" -m pip install 'PyInstaller==6.16.0'
          "$RUNNER_TEMP/nexbot-python/bin/python" -m unittest discover -s tools/installer
          "$RUNNER_TEMP/nexbot-python/bin/python" tools/installer/package.py "${{ matrix.target }}"
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: |
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$RUNNER_TEMP/nexbot-python"
          "$RUNNER_TEMP/nexbot-python/bin/python" -m pip install 'PyInstaller==6.16.0'
          "$RUNNER_TEMP/nexbot-python/bin/python" -m unittest discover -s tools/installer
          "$RUNNER_TEMP/nexbot-python/bin/python" tools/installer/package.py "${{ matrix.target }}"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          python -m pip install PyInstaller==6.16.0
          python -m unittest discover -s tools/installer
          python tools/installer/package.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unsigned-installer-${{ matrix.name }}
          path: dist/installer/*
          if-no-files-found: error
