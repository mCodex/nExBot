name: Rust and Lua

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native test and build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo build --locked --release --workspace --target ${{ matrix.target }}
      - run: cargo build --locked --profile balanced -p nexbot-engine --target ${{ matrix.target }}
      - name: Check Windows startup task definition
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../tools/windows/test-autostart.ps1 -Engine (Resolve-Path "target/${{ matrix.target }}/release/nexbot-engine.exe")
      - name: Check Linux login service
        if: runner.os == 'Linux'
        run: |
          python3 ../tools/linux/test_autostart.py
          mkdir -p "$HOME/.local/share/nexbot/service"
          install -m 700 "target/${{ matrix.target }}/release/nexbot-engine" "$HOME/.local/share/nexbot/service/nexbot-engine"
          systemd-analyze --user --man=no verify ../tools/linux/nexbot-engine.service
      - name: Package startup installer
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            Windows) platform=windows ;;
          esac
          cp -R "../tools/$platform" "target/${{ matrix.target }}/release/autostart"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/nexbot-engine*
            rust/target/${{ matrix.target }}/release/nexbot-bootstrap*
            rust/target/${{ matrix.target }}/release/autostart/
            !**/*.d
            !**/*.pdb
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup toolchain install nightly-2026-11-19 --profile minimal --component llvm-tools-preview
      - run: cargo install --locked --version 0.9.2 cargo-llvm-cov
      - run: cargo +nightly-2026-11-19 llvm-cov --locked --workspace --branch --no-report
      - run: cargo +nightly-2026-11-19 llvm-cov report --branch --lcov --output-path lcov.info
      - run: cargo +nightly-2026-11-19 llvm-cov report --branch --html
      - run: python3 ../tools/check-rust-coverage.py lcov.info --branches
      - if: always()
        run: cargo +nightly-2026-11-19 llvm-cov report --branch --fail-under-lines 90
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rust-coverage
          path: |
            rust/lcov.info
            rust/target/llvm-cov/html/

  audit-and-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: sudo apt-get update && sudo apt-get install -y lua-busted lua5.4
      - run: make test
      - run: luac5.4 -p bridge/_Loader.lua
      - run: cargo install --locked --version 0.22.1 cargo-audit
        working-directory: rust
      - run: cargo audit --file rust/Cargo.lock
